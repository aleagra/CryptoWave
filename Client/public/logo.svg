<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040405" />
      <stop offset="100%" stop-color="#0a120e" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#22C55E" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="45" fill="url(#circleGrad)" stroke="url(#borderGrad)" stroke-width="4" filter="url(#glow)" />
  <!-- Inner Glow Ring -->
  <circle cx="50" cy="50" r="41" fill="none" stroke="#22C55E" stroke-opacity="0.15" stroke-width="2" />
  <!-- Dollar Symbol -->
  <text x="50" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Geist', sans-serif" font-size="46" font-weight="800" fill="#22C55E" text-anchor="middle">$</text>
</svg>
